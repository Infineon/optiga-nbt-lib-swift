name: Swift build
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Show Xcode and Swift versions
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun swift --version
          swift --version

      - name: Build
        run: swift build
